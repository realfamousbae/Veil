name: Ошибка / Bug
description: Что-то работает не так / Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что вы делали, что ожидали увидеть и что увидели. / Steps, expected and actual result.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и браузер / Device and browser
      placeholder: iPhone 16, iOS 26, Safari (установлено как приложение / installed as an app)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Скриншоты, ссылка на место / Screenshots, link to the place
      description: Не прикладывайте данные, которые не хотите публиковать. / Don't attach anything you don't want to be public.
