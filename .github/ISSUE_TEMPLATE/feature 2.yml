name: Идея / Feature request
description: Предложить улучшение / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что хочется / What you'd like
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Как это сочетается с приватностью? / How does it fit the privacy contract?
      description: См. / See PRIVACY.md
