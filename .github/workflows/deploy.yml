name: Deploy

# Deploys the site to Cloudflare Pages after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping deploy (see README → Deploy)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.secrets.outputs.ok == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ok == 'true'
        name: Build with the production config
        run: pnpm build && node scripts/prepare-deploy.mjs
      - if: steps.secrets.outputs.ok == 'true'
        name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4.147.0 pages project create veil --production-branch main || true
          npx --yes wrangler@4.147.0 pages deploy --project-name veil --branch main --commit-dirty=true \
            --commit-hash "$COMMIT_SHA" --commit-message "$COMMIT_MESSAGE"
        env:
          # Shown in the Cloudflare dashboard next to the deployment (Direct Upload has no Git link).
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || 'Manual deploy' }}
