<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Приватная карта мира на OpenStreetMap: без аккаунтов, cookies и слежки. Офлайн-карты, поиск, установка как приложение."
    />
    <!-- Link previews in messengers and social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veil" />
    <meta property="og:title" content="Veil — приватная карта мира" />
    <meta
      property="og:description"
      content="Карта на OpenStreetMap без аккаунтов, cookies и слежки. Офлайн-карты, поиск, работает как приложение."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Veil — приватная карта мира" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="Veil" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Veil</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
